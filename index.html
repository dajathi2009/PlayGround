<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#6caf38">
  <title>El jardín — Defensa vegetal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell" aria-label="Juego de jardín">
    <canvas id="game" aria-label="Tablero de jardín. Selecciona la tarjeta y haz clic en una casilla libre."></canvas>
    <div class="sr-only" id="game-status" aria-live="polite">100 soles. Selecciona la lanzaguisantes para colocarla.</div>
    <section class="wave-hud" aria-label="Estado de la partida">
      <div class="wave-hud-top">
        <strong id="wave-title">Preparando el jardín</strong>
        <button id="pause-game" type="button" aria-pressed="false" disabled>Pausar</button>
      </div>
      <div class="wave-track" role="progressbar" aria-label="Progreso de las oleadas" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <span id="wave-progress"></span>
      </div>
      <p id="wave-details">Oleada 1 de 5 · 0 enemigos vivos</p>
      <p id="wave-countdown" aria-live="polite">La partida empieza pronto</p>
    </section>
    <section class="result-overlay" id="result-overlay" role="dialog" aria-modal="true" aria-labelledby="result-title" hidden>
      <div class="result-card">
        <p class="result-kicker">DEFENSA VEGETAL</p>
        <h1 id="result-title">Jardín defendido</h1>
        <p id="result-message">Has completado todas las oleadas.</p>
        <button id="restart-game" type="button">Jugar de nuevo</button>
      </div>
    </section>
    <div class="help-pill" aria-hidden="true"><span class="help-dot">?</span> Elige planta · clic: plantar · clic derecho: retirar</div>
  </main>
  <script type="module" src="src/main.js"></script>
</body>
</html>
