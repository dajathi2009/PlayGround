<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#8edcf0" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%235d9845'/%3E%3Ccircle cx='32' cy='32' r='11' fill='%23ffe486'/%3E%3Cpath d='M32 6v10m0 32v10M6 32h10m32 0h10M14 14l7 7m22 22 7 7m0-36-7 7m-22 22-7 7' stroke='%23ffe486' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E" />
  <title>Plants vs. Zombies: Lobotomized — Jardín</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Trebuchet MS", "Arial Rounded MT Bold", system-ui, sans-serif;
      --ink: #274c34;
      --cream: #fff6d8;
      --leaf: #5d8f3d;
      --cell-gap: 3px;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #81d8ed; color: var(--ink); user-select: none; }
    .scene { position: relative; width: 100%; height: 100%; min-height: 420px; overflow: hidden; isolation: isolate; }
    .backdrop { position: absolute; inset: 0; z-index: -2; width: 100%; height: 100%; }
    .sky-glow { position: absolute; inset: 0 0 auto; height: 23%; z-index: -1; pointer-events: none; background: linear-gradient(180deg, rgba(255,255,255,.16), transparent); }
    .topbar {
      position: absolute; z-index: 3; inset: 18px 24px auto;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      pointer-events: none;
    }
    .brand { display: flex; align-items: center; gap: 13px; min-width: 0; }
    .brand-mark {
      width: 54px; height: 54px; flex: 0 0 auto; display: grid; place-items: center;
      border: 3px solid #fff5ca; border-radius: 17px; color: #fff9db; font-size: 30px;
      background: linear-gradient(145deg, #73b74e, #397b42); box-shadow: 0 4px 0 #30613a, 0 7px 15px #285c3970;
      transform: rotate(-4deg);
    }
    .brand-copy { text-shadow: 0 2px 0 #fff8df, 0 3px 8px #fff8df; }
    .eyebrow { margin: 0 0 2px; color: #597242; font-size: 10px; font-weight: 900; letter-spacing: .19em; text-transform: uppercase; }
    h1 { margin: 0; color: #315d36; font-size: clamp(18px, 2.2vw, 29px); line-height: 1; letter-spacing: -.04em; font-weight: 1000; }
    .board-status {
      display: flex; align-items: center; gap: 13px; padding: 10px 15px; min-height: 52px;
      border: 2px solid #fff9db; border-radius: 16px; background: #fff9e8e8;
      box-shadow: 0 4px 0 #638c4870, 0 8px 18px #3a683540; color: #426543;
      backdrop-filter: blur(5px); text-align: right;
    }
    .status-dot { width: 11px; height: 11px; flex: 0 0 auto; border-radius: 50%; background: #94bd5e; box-shadow: 0 0 0 4px #94bd5e2c; }
    .status-label { display: block; color: #78906a; font-size: 9px; font-weight: 900; letter-spacing: .15em; }
    .status-value { display: block; margin-top: 2px; font-size: 14px; font-weight: 1000; white-space: nowrap; }
    .field-note {
      position: absolute; z-index: 2; left: 25.2%; top: 17.7%; color: #fff8d8;
      padding: 6px 11px; border: 1px solid #f9f2c563; border-radius: 99px;
      background: #416e3a9c; box-shadow: 0 2px 8px #23523a35; font-size: 10px;
      font-weight: 900; letter-spacing: .12em; text-transform: uppercase; text-shadow: 0 1px 2px #31592d;
      pointer-events: none;
    }
    .board-wrap {
      position: absolute; left: 23.3%; top: 24%; width: 74%; height: 60%;
      display: grid; grid-template: 21px 1fr / 24px 1fr;
      filter: drop-shadow(0 11px 9px #214c3470);
    }
    .axis-corner { grid-area: 1 / 1; }
    .col-axis { grid-area: 1 / 2; display: grid; grid-template-columns: repeat(9, 1fr); gap: var(--cell-gap); align-items: center; }
    .row-axis { grid-area: 2 / 1; display: grid; grid-template-rows: repeat(5, 1fr); gap: var(--cell-gap); align-items: center; }
    .axis-num { color: #fdf2c9; font-size: 11px; font-weight: 1000; text-align: center; text-shadow: 0 1px 3px #254e30, 0 0 5px #214c34; }
    .grid {
      grid-area: 2 / 2; display: grid; grid-template-columns: repeat(9, minmax(0, 1fr));
      grid-template-rows: repeat(5, minmax(0, 1fr)); gap: var(--cell-gap);
      padding: 6px; border: 3px solid #f3e5a5; border-radius: 13px;
      background: linear-gradient(135deg, #7d5429, #a8773b 48%, #76502b);
      box-shadow: inset 0 0 0 2px #5a73374d, 0 3px 0 #5c482c;
      overflow: visible;
    }
    .cell {
      position: relative; min-width: 0; min-height: 0; border: 1px solid #e8e9a47d;
      border-radius: 5px; cursor: crosshair; outline: none;
      background-color: #8ebc4f;
      background-image: linear-gradient(145deg, #ffffff15 0 25%, transparent 25% 72%, #285c2510 72%), linear-gradient(35deg, #6ea243 0 48%, #9fca58 48%);
      box-shadow: inset 0 1px 0 #f6f7b347, inset 0 -3px 0 #376c2c32;
      transition: filter .12s ease, transform .12s ease, box-shadow .12s ease, background-color .12s ease;
    }
    .cell:nth-child(odd) { background-image: linear-gradient(145deg, #ffffff15 0 25%, transparent 25% 72%, #285c2510 72%), linear-gradient(35deg, #79a94a 0 48%, #a8cc5a 48%); }
    .cell::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: radial-gradient(ellipse at 18% 19%, #eef39d35, transparent 42%); pointer-events: none; }
    .cell:hover, .cell:focus-visible, .cell.is-active {
      z-index: 1; border-color: #fff6b8; outline: 2px solid #fff4ad;
      background-color: #d7ed74; filter: brightness(1.13) saturate(1.12);
      box-shadow: inset 0 0 0 2px #fff9c9b8, 0 0 14px #fff4a8cc;
    }
    .cell:focus-visible { outline-offset: 1px; }
    .coordinate-tag {
      position: absolute; z-index: 2; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.94);
      padding: 5px 8px; border: 1px solid #fff8c8; border-radius: 8px;
      color: #fff9dc; background: #365b36ed; box-shadow: 0 2px 7px #29482b75;
      opacity: 0; white-space: nowrap; font-size: 11px; font-weight: 1000; pointer-events: none;
      transition: opacity .1s, transform .1s;
    }
    .cell:hover .coordinate-tag, .cell:focus-visible .coordinate-tag, .cell.is-active .coordinate-tag { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    .bottom-hint {
      position: absolute; z-index: 2; right: 25px; bottom: 20px; display: flex; align-items: center; gap: 8px;
      padding: 8px 12px; border: 1px solid #fff7cf9c; border-radius: 12px; color: #f9f4d0;
      background: #416c3fd4; box-shadow: 0 3px 9px #2756384d; font-size: 11px; font-weight: 800;
      text-shadow: 0 1px 2px #365b37; pointer-events: none;
    }
    .mouse-icon { width: 14px; height: 19px; border: 1.5px solid #fff4cd; border-radius: 8px; position: relative; }
    .mouse-icon::before { content: ""; position: absolute; width: 2px; height: 4px; top: 3px; left: 5px; border-radius: 2px; background: #fff4cd; }
    .sunshine { position: absolute; right: 5.5%; top: 13%; width: 76px; aspect-ratio: 1; border-radius: 50%; background: #ffe989; box-shadow: 0 0 0 12px #fff2a32b, 0 0 42px 18px #fff0a550; }
    .mobile-house { display: none; position: absolute; z-index: -1; left: -20px; top: 18%; width: 220px; height: 165px; pointer-events: none; }
    .foreground { position: absolute; z-index: 1; left: 0; right: 0; bottom: -1px; height: 13%; pointer-events: none; }
    .flower-clump { position: absolute; bottom: 0; width: 128px; height: 105px; }
    .flower-clump.left { left: 3%; transform: scale(.85); transform-origin: bottom left; }
    .flower-clump.right { right: 11%; transform: scale(.68); transform-origin: bottom center; }
    .ground-edge { position: absolute; inset: auto 0 0; height: 20px; background: linear-gradient(#527d3d, #365f36); border-top: 3px solid #aec65d; }
    @media (max-width: 700px) {
      .scene { min-height: 360px; }
      .topbar { inset: max(10px, env(safe-area-inset-top)) 12px auto; gap: 7px; }
      .brand { gap: 8px; }
      .brand-mark { width: 39px; height: 39px; border-radius: 12px; font-size: 23px; border-width: 2px; box-shadow: 0 3px 0 #30613a; }
      .eyebrow { font-size: 7px; letter-spacing: .13em; }
      h1 { font-size: clamp(14px, 4vw, 19px); }
      .board-status { min-height: 41px; padding: 6px 8px; gap: 8px; border-radius: 12px; }
      .status-dot { width: 8px; height: 8px; }
      .status-label { font-size: 7px; }
      .status-value { font-size: 10px; }
      .field-note { left: 5%; top: 18%; font-size: 8px; padding: 5px 8px; }
      .board-wrap { left: 3%; top: 30%; width: 94%; height: min(54%, calc((100vw - 42px) * .68)); grid-template: 18px 1fr / 17px 1fr; }
      .axis-num { font-size: 9px; }
      .grid { gap: 2px; padding: 4px; border-width: 2px; border-radius: 9px; }
      .cell { border-radius: 3px; }
      .coordinate-tag { padding: 4px 5px; font-size: 9px; border-radius: 6px; }
      .bottom-hint { right: 10px; bottom: max(11px, env(safe-area-inset-bottom)); font-size: 9px; padding: 6px 9px; }
      .sunshine { right: 12%; top: 14%; width: 48px; }
      .mobile-house { display: block; }
      .foreground { height: 11%; }
      .flower-clump.left { transform: scale(.57); }
      .flower-clump.right { transform: scale(.48); right: 17%; }
    }
    @media (max-height: 520px) and (min-width: 701px) {
      .topbar { inset: 9px 18px auto; }
      .brand-mark { width: 42px; height: 42px; font-size: 24px; }
      .board-wrap { top: 23%; height: 66%; }
      .field-note { top: 16.5%; }
      .bottom-hint { bottom: 10px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
  </style>
</head>

  <script>
    (() => {
      "use strict";
      const ROWS = 5;
      const COLUMNS = 9;
      const grid = document.getElementById("grid");
      const status = document.getElementById("statusValue");
      const dot = document.getElementById("statusDot");
      const cells = [];
      const colAxis = document.getElementById("colAxis");
      const rowAxis = document.getElementById("rowAxis");

      for (let column = 0; column < COLUMNS; column++) {
        const label = document.createElement("span");
        label.className = "axis-num";
        label.textContent = column;
        colAxis.append(label);
      }
      for (let row = 0; row < ROWS; row++) {
        const label = document.createElement("span");
        label.className = "axis-num";
        label.textContent = row;
        rowAxis.append(label);
        for (let column = 0; column < COLUMNS; column++) {
          const cell = document.createElement("div");
          cell.className = "cell";
          cell.setAttribute("role", "gridcell");
          cell.setAttribute("tabindex", "0");
          cell.dataset.row = row;
          cell.dataset.column = column;
          cell.setAttribute("aria-label", `Fila ${row}, columna ${column}`);
          cell.setAttribute("aria-selected", "false");
          cell.innerHTML = `<span class="coordinate-tag">F${row} · C${column}</span>`;
          cell.addEventListener("pointerenter", () => selectCell(row, column, cell));
          cell.addEventListener("focus", () => selectCell(row, column, cell));
          cell.addEventListener("pointerleave", (event) => {
            if (!cell.contains(event.relatedTarget) && document.activeElement !== cell) clearSelection();
          });
          cell.addEventListener("blur", () => {
            if (!cell.matches(":hover")) clearSelection();
          });
          grid.append(cell);
          cells.push(cell);
        }
      }

      function selectCell(row, column, element) {
        for (const cell of cells) {
          const active = cell === element;
          cell.classList.toggle("is-active", active);
          cell.setAttribute("aria-selected", String(active));
        }
        status.textContent = `F${row} · C${column}`;
        dot.style.backgroundColor = "#e4b947";
        dot.style.boxShadow = "0 0 0 4px #e4b94738";
      }
      function clearSelection() {
        for (const cell of cells) {
          cell.classList.remove("is-active");
          cell.setAttribute("aria-selected", "false");
        }
        status.textContent = "— · —";
        dot.style.backgroundColor = "#94bd5e";
        dot.style.boxShadow = "0 0 0 4px #94bd5e2c";
      }

      // Geometry helpers use zero-based row/column coordinates and live layout measurements.
      function isInBoard(row, column) {
        return Number.isInteger(row) && Number.isInteger(column) && row >= 0 && row < ROWS && column >= 0 && column < COLUMNS;
      }
      function getCellPosition(row, column) {
        if (!isInBoard(row, column)) return null;
        const rect = cells[row * COLUMNS + column].getBoundingClientRect();
        const sceneRect = document.querySelector(".scene").getBoundingClientRect();
        return {
          x: rect.left + rect.width / 2 - sceneRect.left,
          y: rect.top + rect.height / 2 - sceneRect.top
        };
      }
      function screenToBoard(screenX, screenY) {
        for (let row = 0; row < ROWS; row++) {
          for (let column = 0; column < COLUMNS; column++) {
            const rect = cells[row * COLUMNS + column].getBoundingClientRect();
            if (screenX >= rect.left && screenX < rect.right && screenY >= rect.top && screenY < rect.bottom) return { row, column };
          }
        }
        return null;
      }
      function identifyCell(screenX, screenY) {
        const coordinate = screenToBoard(screenX, screenY);
        return coordinate ? { ...coordinate, center: getCellPosition(coordinate.row, coordinate.column) } : null;
      }
      // Expose the scene's small coordinate API for the next gameplay stage.
      window.boardCoordinates = Object.freeze({ rows: ROWS, columns: COLUMNS, isInBoard, getCellPosition, screenToBoard, identifyCell });
    })();
  </script>
